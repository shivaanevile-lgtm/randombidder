<style>

    --paper:#F5EFE3;
    --card:#FDFBF5;
    --ink:#211E1A;
    --ink-soft:#7A7264;
    --rust:#C1543C;
    --rust-soft:#D97757;
    --gold:#E3A62F;
    --sage:#5C8A5C;
    --line:rgba(33,30,26,0.10);
    --mono: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;

  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);min-height:100vh;padding:28px 16px 60px;}
  .wrap{max-width:760px;margin:0 auto;}
  .eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:10px;}
  h1{font-size:clamp(30px,5.5vw,42px);margin:0 0 6px;letter-spacing:-0.3px;line-height:1.05;font-weight:400;}
  .sub{font-family:var(--sans);color:var(--ink-soft);font-size:15px;margin-bottom:26px;line-height:1.5;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 28px;margin-bottom:18px;}
  label{display:block;font-family:var(--sans);font-size:12px;letter-spacing:0.8px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px;}
  input[type=text], input[type=number]{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:var(--sans);margin-bottom:14px;}
  input[type=number]{font-family:var(--mono);font-weight:700;font-size:20px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .chip{font-family:var(--sans);font-size:14px;padding:10px 18px;border:1px solid var(--line);border-radius:30px;background:#fff;cursor:pointer;color:var(--ink);transition:all .15s;}
  .chip:hover{border-color:var(--rust);color:var(--rust);}
  .chip.active{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:600;}
  .btn{font-family:var(--sans);font-size:16px;font-weight:600;padding:14px 22px;border-radius:14px;border:none;cursor:pointer;background:var(--rust);color:#fff;transition:transform .1s, background .15s;}
  .btn:hover{background:var(--rust-soft);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;}
  .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn.secondary:hover{border-color:var(--rust);color:var(--rust);background:transparent;}
  .btn.pass{background:transparent;border:1px solid var(--rust);color:var(--rust);}
  .btn.pass:hover{background:rgba(193,84,60,0.08);}
  .btn.wide{width:100%;text-align:center;margin-top:4px;}
  .mode-card{cursor:pointer;transition:border-color .15s;border:1.5px solid var(--line);}
  .mode-card:hover{border-color:var(--rust);}
  .mode-card h3{margin:0 0 4px;font-size:20px;font-weight:400;font-family:var(--serif);}
  .mode-card p{margin:0;font-family:var(--sans);font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
  .code-display{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:6px;color:var(--rust);text-align:center;padding:18px 0;}
  .error-msg{font-family:var(--sans);font-size:13.5px;color:var(--rust);background:rgba(193,84,60,0.08);border-radius:10px;padding:10px 14px;margin-bottom:12px;}
  .lot-card{text-align:center;padding:34px 28px;}
  .lot-name{font-family:var(--serif);font-size:30px;margin:6px 0 18px;}
  .lot-meta{font-family:var(--sans);font-size:12px;color:var(--ink-soft);letter-spacing:0.6px;text-transform:uppercase;margin-bottom:4px;}
  .bid-status{font-family:var(--mono);font-size:15px;color:var(--ink-soft);margin-bottom:22px;}
  .bid-status .amt{font-size:26px;font-weight:700;color:var(--rust);}
  .bid-status .who{font-family:var(--sans);font-size:12px;color:var(--ink-soft);}

  .waiting{font-family:var(--sans);color:var(--ink-soft);font-style:italic;font-size:14px;margin-top:8px;}

// Builds each position's draft order fresh for a new game: shuffled current pros + icons,
// with one random icon guaranteed to lead off each position so both players always get
// a shot at at least one legend per position, every draft.
function buildDraftPools(){
  const pools = {};
  Object.keys(FOOTBALL_THEME.pools).forEach(pos=>{
    const currents = FOOTBALL_THEME.pools[pos];
    const icons = ICON_POOLS[pos] || [];
    const guaranteedIcon = icons[Math.floor(Math.random()*icons.length)];
    const rest = shuffleArr([...currents, ...icons.filter(n=>n!==guaranteedIcon)]);
    pools[pos] = [guaranteedIcon, ...rest];
  });
  return pools;
}

// ---------- AI preference memory (per-browser, practice mode only) ----------

const PREFS_KEY = "byb_ai_prefs_v1";
function loadPrefs(){
  try{
    const raw = localStorage.getItem(PREFS_KEY);
    return raw ? JSON.parse(raw) : { items:{}, categories:{} };
  }catch(e){ return { items:{}, categories:{} }; }
}
function savePrefs(prefs){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){ /* storage unavailable, fine */ }
}
function recordHumanInterest(itemName, categoryLabel, amount){
  if(amount <= 0) return;
  const prefs = loadPrefs();
  if(itemName){
    prefs.items[itemName] = Math.max(prefs.items[itemName]||0, amount);
  }
  if(categoryLabel){
    const c = prefs.categories[categoryLabel] || { sum:0, count:0 };
    c.sum += amount; c.count += 1;
    prefs.categories[categoryLabel] = c;
  }
  savePrefs(prefs);

  // best-effort contribution to the shared global learning store
  fetch("/api/prefs", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ item:itemName, category:categoryLabel, amount })
  }).catch(()=>{ /* offline or not deployed yet — local memory still works */ });
}
function getLearnedInterest(itemName, categoryLabel){
  const prefs = loadPrefs();
  const itemScore = itemName ? (prefs.items[itemName] || 0) : 0;
  const catEntry = categoryLabel ? prefs.categories[categoryLabel] : null;
  const catScore = catEntry && catEntry.count ? catEntry.sum / catEntry.count : 0;

  let globalItemScore = 0, globalCatScore = 0;
  if(state._globalPrefs){
    const gi = itemName ? state._globalPrefs.items[itemName] : null;
    if(gi && gi.count) globalItemScore = gi.sum / gi.count;
    const gc = categoryLabel ? state._globalPrefs.categories[categoryLabel] : null;
    if(gc && gc.count) globalCatScore = gc.sum / gc.count;
  }

  return Math.max(itemScore, catScore, globalItemScore, globalCatScore);
}
async function fetchGlobalPrefs(){
  try{
    const res = await fetch("/api/prefs");
    const data = await res.json();
    if(!data.error) state._globalPrefs = data;
  }catch(e){ /* offline or not deployed yet — falls back to local memory only */ }
}

// ---------- sound + confetti ----------

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function playTone(freq, duration, type, startTime, gainPeak){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ctx.currentTime + startTime);
  gain.gain.linearRampToValueAtTime(gainPeak||0.15, ctx.currentTime + startTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(ctx.currentTime + startTime);
  osc.stop(ctx.currentTime + startTime + duration + 0.02);
}
function playGavelSound(){
  playTone(140, 0.12, "square", 0, 0.16);
  playTone(95, 0.14, "square", 0.06, 0.12);
}
function playCoinSound(){
  playTone(880, 0.09, "square", 0, 0.11);
  playTone(1318, 0.14, "square", 0.07, 0.11);
}
function triggerConfetti(){
  const colors = ['#C1543C','#E3A62F','#5C8A5C','#7A7264'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;';
  document.body.appendChild(container);
  for(let i=0;i<28;i++){
    const p = document.createElement('div');
    const size = 6+Math.random()*6;
    p.style.cssText = `position:absolute;top:-20px;left:${Math.random()*100}%;width:${size}px;height:${size*0.6}px;background:${colors[i%colors.length]};opacity:0.9;border-radius:2px;transform:rotate(${Math.random()*360}deg);animation:confetti-fall ${1.2+Math.random()*0.8}s ease-in forwards;animation-delay:${Math.random()*0.2}s;`;
    container.appendChild(p);
  }
  setTimeout(()=>container.remove(), 2400);
}
function triggerRevealEffects(r){
  playGavelSound();
  if(r.winner === "me"){
    setTimeout(()=>playCoinSound(), 130);
    if(r.price >= 1 && r.price <= 2){
      setTimeout(()=>triggerConfetti(), 160);
    }
  }
}

function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

  const app = document.getElementById("app");
  if(state.screen==="setup") app.innerHTML = renderSetup();
  else if(state.screen==="connect") app.innerHTML = renderConnect();
  else if(state.screen==="room-wait") app.innerHTML = renderRoomWait();
  else if(state.screen==="auction") app.innerHTML = renderAuction();
  else if(state.screen==="results") app.innerHTML = renderResults();
  attachHandlers();

  if(activeId){
    const el = document.getElementById(activeId);
    if(el && (el.tagName==="INPUT" || el.tagName==="TEXTAREA")){
      el.focus({ preventScroll:true });
      if(selStart !== null && selEnd !== null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){ /* ignore */ }
      }
    }
  }
}

function squadProgressText(filled, categories){
  return categories.map(c=>{
    const have = filled[c.cat] || 0;
    return `<b>${c.label}${c.count>1?'s':''}</b> ${have}/${c.count}`;
  }).join(" &nbsp;·&nbsp; ");
}

function renderAuction(){
  const g = state.game;
  if(!g) return `<div class="loading">Loading...</div>`;
  const isSlotted = g.themeType === "slotted";

  if(state.revealing){
    const r = state.revealing;
    const iWon = r.winner === "me";
    const oppWon = r.winner === "opp";
    return `
      <div class="eyebrow">${themeIcon(g.theme)} ${g.theme}${isSlotted && r.categoryLabel ? " · " + r.categoryLabel : ""}</div>
      <h1>${r.winner ? "Sold" : "Passed"}</h1>
      <div class="card lot-card">
        <div class="lot-name">${r.item}</div>
        ${r.winner ? `
          <div class="reveal-tag">${iWon ? "You win it" : "They win it"}</div>
          <div class="reveal-price">$${r.price}</div>
        ` : `<div class="reveal-tag">Nobody wanted it enough.</div>`}
      </div>
    `;
  }

  const meEligible = isSlotted ? g.meEligible : true;
  const myTurn = g.turn === "me" && meEligible;
  const noBidYet = g.currentBidder === null;

  return `
    <div class="eyebrow">${themeIcon(g.theme)} ${g.theme}</div>
    <h1>Live auction</h1>
    ${isSlotted
      ? `<div class="squad-progress">${squadProgressText(g.me.filled, g.categories)}</div>`
      : `<div class="progress-label">Lot ${g.lotIndex + 1} of ${g.totalLots}</div>`
    }

    <div class="card lot-card">
      <div class="lot-meta">${isSlotted ? "Bidding for: " + (g.currentCategoryLabel || "") : "Up for bid"}</div>
      <div class="lot-name">${g.currentItem || "—"}</div>

      <div class="bid-status">
        ${noBidYet ? "No bids yet" : `<span class="amt">$${g.currentBid}</span> <span class="who">— currently held by ${g.currentBidder==='me'?'you':(g.opponent?g.opponent.name:'AI')}</span>`}
      </div>
      ${state.bidTicker.length ? `<div class="bid-ticker">${state.bidTicker.map(t=>`<span>${t}</span>`).join(' <span class="arrow">→</span> ')}</div>` : ""}

      ${!meEligible ? `
        <div class="waiting"><span class="dot on"></span>You've already filled this spot — waiting on ${g.opponent ? g.opponent.name : 'the AI'}...</div>
      ` : myTurn ? `
        <div class="turn-flag">Your move</div>
        <div class="raise-row">
          <input type="number" id="bid-input" min="${g.currentBid+1}" max="${g.me.budget}" placeholder="${g.currentBid+1}" value="${state.bidValue}">
        </div>
        <div class="action-row">
          <button class="btn" id="raise-btn">Raise</button>
          <button class="btn pass" id="pass-btn">${noBidYet ? "Skip it" : "Let it go"}</button>
        </div>
        <div class="waiting">You have $${g.me.budget} left.</div>
      ` : `
        <div class="turn-flag waiting"><span class="dot on"></span>Waiting for ${g.opponent ? g.opponent.name : 'the AI'} to respond...</div>
      `}
    </div>

    <div class="stalls">
      ${renderStall(g.me, "You")}
      ${renderStall(g.opponent || {name:'AI',budget:20,items:[]}, g.opponent ? g.opponent.name : "AI")}
    </div>
  `;
}

function renderStall(p, label, highlightSteal){
  let stealIdx = -1;
  if(highlightSteal){
    let min = Infinity;
    p.items.forEach((it,i)=>{ if(!it.freebie && it.p>0 && it.p<min){ min=it.p; stealIdx=i; } });
  }
  return `
    <div class="card stall">
      <div class="stall-head">
        <h3>${label}</h3>
        <span class="budget">$${p.budget}</span>
      </div>
      <div class="budget-label">remaining · ${p.items.length} item${p.items.length===1?'':'s'}</div>
      <div class="spectrum"></div>
      <ul class="cart">
        ${p.items.length ? p.items.map((it,i)=>`<li class="${it.freebie?'freebie':''}"><span>${it.freebie?'🎁 ':''}${i===stealIdx?'🎉 ':''}${it.cat?`<span class="tagcat">${it.cat}</span>`:''}${it.n}</span><span>${it.freebie?'free':'$'+it.p}</span></li>`).join("") : `<li class="empty">Nothing yet</li>`}
      </ul>
    </div>
  `;
}

function attachHandlers(){
  document.querySelectorAll("[data-theme]").forEach(el=>{
    el.onclick = ()=>{
      const t = el.dataset.theme;
      state.theme = t;
      if(t==="__custom__"){ state.pool = []; state.themeType = "open"; }
      else if(t==="__football__"){ state.pool = []; state.themeType = "slotted"; }
      else { state.pool = [...OPEN_THEMES[t]]; state.themeType = "open"; }
      render();
    };
  });

  const customInput = document.getElementById("custom-input");
  if(customInput) customInput.oninput = (e)=>{ state.customText = e.target.value; };

  const genBtn = document.getElementById("gen-custom");
  if(genBtn) genBtn.onclick = generateCustomTheme;

  document.querySelectorAll("[data-connect]").forEach(el=>{
    el.onclick = ()=>{
      if(!state.themeType) return;
      if(state.themeType==="open" && !state.pool.length) return;
      state.connectMode = el.dataset.connect;
      state.errorMsg = null;
      state.screen = "connect";
      render();
    };
  });

  const backBtn = document.getElementById("back-btn");
  if(backBtn) backBtn.onclick = ()=>{ state.screen="setup"; state.errorMsg=null; render(); };

  const joinCodeInput = document.getElementById("join-code");
  if(joinCodeInput) joinCodeInput.oninput = (e)=>{ state.joinCode = e.target.value.toUpperCase(); };

  const goBtn = document.getElementById("go-btn");
  if(goBtn) goBtn.onclick = handleGo;

  const copyBtn = document.getElementById("copy-btn");
  if(copyBtn) copyBtn.onclick = ()=>{
    navigator.clipboard?.writeText(state.roomCode).catch(()=>{});
    copyBtn.textContent = "Copied!";
    setTimeout(()=>{ copyBtn.textContent = "Copy code"; }, 1500);
  };

  const leaveBtn = document.getElementById("leave-btn");
  if(leaveBtn) leaveBtn.onclick = ()=>{ stopPolling(); state.screen = "setup"; render(); };

  const bidInput = document.getElementById("bid-input");
  if(bidInput) bidInput.oninput = (e)=>{ state.bidValue = e.target.value; };

  const raiseBtn = document.getElementById("raise-btn");
  if(raiseBtn) raiseBtn.onclick = handleRaise;

  const passBtn = document.getElementById("pass-btn");
  if(passBtn) passBtn.onclick = handlePass;

  const judgeBtn = document.getElementById("judge-btn");
  if(judgeBtn) judgeBtn.onclick = judgeBuilds;

  const shareBtn = document.getElementById("share-btn");
  if(shareBtn) shareBtn.onclick = handleShareCard;

  const nextRoundBtn = document.getElementById("next-round-btn");
  if(nextRoundBtn) nextRoundBtn.onclick = handleNewRound;

  const restartBtn = document.getElementById("restart-btn");
  if(restartBtn) restartBtn.onclick = ()=>{
    stopPolling();
    if(aiTimer){ clearTimeout(aiTimer); aiTimer=null; }
    state = {screen:"setup", theme:null, themeType:null, pool:[], customText:"", loadingCustom:false,
      connectMode:null, joinCode:"", errorMsg:null, connecting:false,
      roomCode:null, token:null, role:null, game:null, revealing:null, bidValue:"",
      verdict:null, winner:null, loadingVerdict:false, _globalPrefs:null};
    render();
  };
}

async function handleGo(){
  state.errorMsg = null;

  if(state.connectMode === "practice"){
    if(state.themeType === "slotted") startPracticeSlotted();
    else startPracticeOpen();
    return;
  }

  if(state.connectMode === "create"){
    state.connecting = true; render();
    try{
      const themeName = state.theme==="__custom__" ? state.customText : state.theme==="__football__" ? FOOTBALL_THEME.label : state.theme;
      const payload = state.themeType==="slotted"
        ? { action:"create", themeType:"slotted", theme: themeName, categories: FOOTBALL_THEME.categories, pools: buildDraftPools() }
        : { action:"create", themeType:"open", theme: themeName, lots: state.pool };
      const res = await fetch("/api/room", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      state.roomCode = data.code; state.token = data.token; state.role = data.role;
      state.connecting = false;
      state.game = { theme: themeName };
      state.screen = "room-wait";
      render();
      startPolling();
    }catch(e){
      state.connecting = false;
      state.errorMsg = "Couldn't reach the room server (" + e.message + "). Online rooms only work once this is deployed to Netlify — try Practice vs AI in the meantime.";
      render();
    }
    return;
  }

  if(state.connectMode === "join"){
    if(state.joinCode.length < 5){ state.errorMsg = "Enter the full 5-character code."; render(); return; }
    state.connecting = true; render();
    try{
      const res = await fetch("/api/room", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ action:"join", code: state.joinCode }) });
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      state.roomCode = data.code; state.token = data.token; state.role = data.role;
      state.connecting = false;
      state.screen = "auction";
      render();
      startPolling();
    }catch(e){
      state.connecting = false;
      state.errorMsg = "Couldn't join that room (" + e.message + ").";
      render();
    }
  }
}

// ---------- ONLINE POLLING ----------

function startPolling(){ stopPolling(); pollOnce(); pollTimer = setInterval(pollOnce, 1000); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

async function pollOnce(){
  try{
    const res = await fetch(`/api/room?code=${state.roomCode}&token=${state.token}`);
    const data = await res.json();
    if(data.error) return;
    applyServerState(data);
  }catch(e){ /* transient */ }
}

function applyServerState(data){
  const prevKey = state.game && state.game.resolved ? JSON.stringify(state.game.resolved) : null;
  const newKey = data.resolved ? JSON.stringify(data.resolved) : null;
  const prevGame = state.game;

  if(data.phase === "auction"){
    if(!prevGame || prevGame.currentItem !== data.currentItem){
      state.bidTicker = [];
    } else if(prevGame.currentBid !== data.currentBid && data.currentBidder){
      const who = data.currentBidder === "me" ? "You" : (data.opponent ? data.opponent.name : "Them");
      state.bidTicker.push(`${who}: $${data.currentBid}`);
    }
  }

  state.game = {
    theme: data.theme, themeType: data.themeType, phase: data.phase,
    lotIndex: data.lotIndex, totalLots: data.totalLots,
    currentItem: data.currentItem, currentCategoryLabel: data.currentCategoryLabel,
    meEligible: data.meEligible, currentBid: data.currentBid, currentBidder: data.currentBidder, turn: data.turn,
    resolved: data.resolved,
    me: data.me, opponent: data.opponent,
    categories: data.themeType==="slotted" ? FOOTBALL_THEME.categories : null
  };
  if(data.themeType==="slotted" && data.me){
    const filled = {};
    FOOTBALL_THEME.categories.forEach(c=>{ filled[c.cat]=0; });
    data.me.items.forEach(it=>{ if(it.cat) filled[it.cat] = (filled[it.cat]||0)+1; });
    state.game.me.filled = filled;
  }

  if(data.phase === "lobby"){
    state.screen = "room-wait";
  } else if(data.phase === "auction"){
    if(state.screen !== "auction"){
      state.screen = "auction";
      state.verdict = null;
      state.winner = null;
    }
    if(newKey && newKey !== prevKey && !state.revealing){
      const r = data.resolved;
      state.revealing = {
        item: r.item, categoryLabel: r.categoryLabel, price: r.price,
        winner: r.winner === state.role ? "me" : (r.winner ? "opp" : null)
      };
      triggerRevealEffects(state.revealing);
      setTimeout(()=>{ state.revealing = null; render(); }, 1900);
    }
    state.bidValue = "";
  } else if(data.phase === "results"){
    if(!state.revealing){ state.screen = "results"; }
  }
  render();
}

async function handleRaise(){
  const g = state.game;
  const amt = Math.floor(Number(state.bidValue) || (g.currentBid+1));
  if(amt <= g.currentBid || amt > g.me.budget) return;

  if(state.connectMode === "practice"){ localRaise("me", amt); return; }

  try{
    const res = await fetch("/api/room", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ action:"raise", code: state.roomCode, token: state.token, amount: amt }) });
    const data = await res.json();
    if(data.error) return;
    applyServerState(data);
  }catch(e){ /* retry on next poll */ }
}

async function handlePass(){
  if(state.connectMode === "practice"){ localPass("me"); return; }
  try{
    const res = await fetch("/api/room", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ action:"pass", code: state.roomCode, token: state.token }) });
    const data = await res.json();
    if(data.error) return;
    applyServerState(data);
  }catch(e){ /* retry on next poll */ }
}

async function handleNewRound(){
  state.errorMsg = null;
  state.connecting = true;
  render();
  try{
    const themeName = state.theme==="__custom__" ? state.customText : state.theme==="__football__" ? FOOTBALL_THEME.label : state.theme;
    const payload = state.themeType==="slotted"
      ? { action:"newRound", code: state.roomCode, token: state.token, themeType:"slotted", theme: themeName, categories: FOOTBALL_THEME.categories, pools: buildDraftPools() }
      : { action:"newRound", code: state.roomCode, token: state.token, themeType:"open", theme: themeName, lots: state.pool };
    const res = await fetch("/api/room", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    state.connecting = false;
    applyServerState(data);
    if(!pollTimer) startPolling();
  }catch(e){
    state.connecting = false;
    state.errorMsg = "Couldn't start the next round (" + e.message + ").";
    render();
  }
}

// ---------- PRACTICE: shared ascending-auction engine ----------

function shuffleArr(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function otherRole(r){ return r==="me" ? "opp" : "me"; }

function startTurnAuctionLocal(){
  const g = state.game;
  g.currentBid = 0; g.currentBidder = null; g.openPasses = 0; g.turn = g.nextStarter;
  state.bidValue = "";
  state.bidTicker = [];
  if(g.turn === "opp") scheduleAi();
}

function scheduleAi(){
  if(aiTimer) clearTimeout(aiTimer);
  aiTimer = setTimeout(aiActPractice, 850);
}

function localRaise(role, amt){
  const g = state.game;
  if(role === "me"){
    const catLabel = g.themeType==="slotted" ? g.currentCategoryLabel : null;
    recordHumanInterest(g.currentItem, catLabel, amt);
  }
  state.bidTicker.push(`${role==="me"?"You":(g.opponent?g.opponent.name:"AI")}: $${amt}`);
  g.currentBid = amt;
  g.currentBidder = role;
  g.openPasses = 0;
  g.turn = otherRole(role);
  render();
  if(g.turn === "opp") scheduleAi();
}

function localPass(role){
  const g = state.game;
  if(g.currentBidder === null){
    g.openPasses += 1;
    if(g.openPasses >= 2){
      finishLotLocal(null);
      return;
    } else {
      g.turn = otherRole(role);
      render();
      if(g.turn === "opp") scheduleAi();
    }
  } else {
    finishLotLocal(g.currentBidder);
  }
}

function finishLotLocal(winnerOrNull){
  const g = state.game;
  if(g.themeType === "slotted"){
    const item = g.currentItem, cat = g.currentCategory, categoryLabel = g.currentCategoryLabel, price = g.currentBid;
    if(winnerOrNull){
      const w = winnerOrNull==="me" ? g.me : g.opponent;
      w.budget -= price;
      w.items.push({ n:item, p:price, freebie:false, cat });
      w.filled[cat] += 1;
    }
    state.revealing = { item, price, winner: winnerOrNull, categoryLabel };
    triggerRevealEffects(state.revealing);
    g.nextStarter = otherRole(g.nextStarter);
    setTimeout(()=>{ state.revealing=null; drawSlottedLotLocal(); render(); }, 1900);
  } else {
    const item = g.currentItem, price = g.currentBid;
    if(winnerOrNull){
      const w = winnerOrNull==="me" ? g.me : g.opponent;
      w.budget -= price;
      w.items.push({ n:item, p:price, freebie:false });
    } else {
      state._unsold.push(item);
    }
    state.revealing = { item, price, winner: winnerOrNull, categoryLabel:null };
    triggerRevealEffects(state.revealing);
    g.nextStarter = otherRole(g.nextStarter);
    setTimeout(()=>{ state.revealing=null; drawOpenLotLocal(); render(); }, 1900);
  }
  render();
}

function totalRemainingNeededLocal(player, categories, catIndex){
  let total = 0;
  for(let i=catIndex; i<categories.length; i++){
    const c = categories[i];
    total += Math.max(0, c.count - (player.filled ? (player.filled[c.cat]||0) : 0));
  }
  return Math.max(1, total);
}

function aiActPractice(){
  const g = state.game;
  if(!g || g.turn !== "opp") return;
  const budget = g.opponent.budget;

  let maxWillingness;
  if(g.themeType === "slotted"){
    const needed = totalRemainingNeededLocal(g.opponent, g.categories, g.catIndex);
    const ratingFactor = playerRatingFactor(g.currentItem);
    maxWillingness = (budget / needed) * (1.5 + Math.random()*1.0) * ratingFactor;
  } else {
    const owned = g.opponent.items.length;
    const stillNeeded = Math.max(1, 5 - owned);
    maxWillingness = (budget / stillNeeded) * (1.3 + Math.random()*0.9);
  }

  const nextBid = g.currentBid + 1 + Math.floor(Math.random()*3);
  const wantsToOpen = g.themeType === "slotted"
    ? Math.random() < Math.min(0.97, 0.55 + playerRatingFactor(g.currentItem)*0.3)
    : Math.random() < 0.92;

  const catLabel = g.themeType==="slotted" ? g.currentCategoryLabel : null;
  const learned = getLearnedInterest(g.currentItem, catLabel);
  if(learned > 0){
    maxWillingness = Math.max(maxWillingness, Math.min(budget, learned * 1.15));
  }

  if(g.currentBidder === null){
    if(wantsToOpen && nextBid <= Math.min(budget, maxWillingness)){
      localRaise("opp", Math.min(budget, nextBid));
    } else {
      localPass("opp");
    }
  } else if(g.currentBidder === "opp"){
    return;
  } else {
    if(nextBid <= Math.min(budget, maxWillingness) && nextBid <= budget){
      localRaise("opp", nextBid);
    } else {
      localPass("opp");
    }
  }
}

// ---------- PRACTICE: OPEN THEMES ----------

function startPracticeOpen(){
  const lots = shuffleArr(state.pool);
  state.game = {
    theme: state.theme==="__custom__" ? state.customText : state.theme,
    themeType: "open", phase: "auction",
    lotIndex: 0, totalLots: lots.length, currentItem: null,
    currentBid:0, currentBidder:null, turn:"me", openPasses:0, nextStarter:"me",
    resolved: null,
    me: { budget: 20, items: [] },
    opponent: { name: "AI", budget: 20, items: [] }
  };
  state._lots = lots;
  state._unsold = [];
  state.screen = "auction";
  fetchGlobalPrefs();
  drawOpenLotLocal();
  render();
}

function drawOpenLotLocal(){
  const g = state.game;
  const meNeeds = g.me.items.length < 5;
  const oppNeeds = g.opponent.items.length < 5;
  if(!meNeeds && !oppNeeds){ state.screen = "results"; return; }

  let item;
  if(g.lotIndex < state._lots.length){ item = state._lots[g.lotIndex]; g.lotIndex += 1; }
  else if(state._unsold.length){ item = state._unsold.shift(); }
  else { item = "Bonus pick"; }
  g.currentItem = item;

  if(meNeeds && oppNeeds){
    startTurnAuctionLocal();
  } else {
    const soloKey = meNeeds ? "me" : "opp";
    const solo = soloKey==="me" ? g.me : g.opponent;
    solo.items.push({ n:item, p:0, freebie:true });
    state.revealing = { item, price:0, winner:soloKey, categoryLabel:null };
    triggerRevealEffects(state.revealing);
    setTimeout(()=>{ state.revealing=null; drawOpenLotLocal(); render(); }, 1900);
  }
}

// ---------- PRACTICE: SLOTTED FOOTBALL ----------

function startPracticeSlotted(){
  const cats = FOOTBALL_THEME.categories.map(c=>({...c}));
  const pools = buildDraftPools();

  state.game = {
    theme: FOOTBALL_THEME.label, themeType: "slotted",
    categories: cats, catIndex: 0, pools,
    currentItem: null, currentCategory:null, currentCategoryLabel: null, meEligible: true,
    currentBid:0, currentBidder:null, turn:"me", openPasses:0, nextStarter:"me",
    resolved: null,
    me: { budget:20, items:[], filled:{GK:0,DEF:0,MID:0,ATT:0} },
    opponent: { name:"AI", budget:20, items:[], filled:{GK:0,DEF:0,MID:0,ATT:0} }
  };
  state.screen = "auction";
  fetchGlobalPrefs();
  drawSlottedLotLocal();
  render();
}

function drawSlottedLotLocal(){
  const g = state.game;
  let info = g.categories[g.catIndex];
  while(info && g.me.filled[info.cat] >= info.count && g.opponent.filled[info.cat] >= info.count){
    g.catIndex += 1;
    info = g.categories[g.catIndex];
  }
  if(!info){
    applyPracticeLeftoversSlotted();
    state.screen = "results";
    return;
  }
  const meNeeds = g.me.filled[info.cat] < info.count;
  const oppNeeds = g.opponent.filled[info.cat] < info.count;
  g.currentCategory = info.cat;
  g.currentCategoryLabel = info.label;
  const pool = g.pools[info.cat];
  g.currentItem = pool.length ? pool.shift() : "Free agent " + info.label.toLowerCase();
  g.meEligible = meNeeds;
  g.eligibleOpp = oppNeeds;

  if(meNeeds && oppNeeds){
    startTurnAuctionLocal();
  } else {
    const soloKey = meNeeds ? "me" : "opp";
    const solo = soloKey==="me" ? g.me : g.opponent;
    const price = 0;
    solo.items.push({ n:g.currentItem, p:price, freebie:true, cat:info.cat });
    solo.filled[info.cat] += 1;
    state.revealing = { item:g.currentItem, price, winner:soloKey, categoryLabel:info.label };
    triggerRevealEffects(state.revealing);
    setTimeout(()=>{ state.revealing=null; drawSlottedLotLocal(); render(); }, 1900);
  }
}

function applyPracticeLeftoversSlotted(){
  const g = state.game;
  [g.me, g.opponent].forEach(p=>{
    g.categories.forEach(info=>{
      while(p.filled[info.cat] < info.count){
        p.items.push({ n:"Free agent "+info.label.toLowerCase(), p:0, freebie:true, cat:info.cat });
        p.filled[info.cat] += 1;
      }
    });
  });
}

// ---------- FREE offline helpers (custom theme + judge — no API, no cost) ----------

const CUSTOM_ADJECTIVES = ["Custom-built","Vintage","Golden","Turbocharged","Luxury","Handcrafted","State-of-the-art","Rare","Legendary","Portable","Oversized","Limited-edition","Solar-powered","Award-winning","Top-of-the-line","Heavy-duty"];
const CUSTOM_FEATURES = ["with a built-in sound system","with a mini fridge inside","with a loyal following","with five-star reviews","with a secret menu","with endless refills","with a lifetime warranty","with extra storage","with a fresh coat of paint","with premium upgrades","with a killer paint job","with VIP-only access","with a waiting list","with its own theme song","with a built-in cooler"];
const CUSTOM_FILLER_FNS = [
  (t)=>`A basic ${t} starter kit`,
  (t)=>`A slightly used ${t}`,
  (t)=>`Last year's ${t} model`,
  (t)=>`A no-frills ${t}`,
  (t)=>`A hand-me-down ${t}`,
  (t)=>`An entry-level ${t}`
];

function generateCustomThemeLocal(themeText){
  const t = themeText.trim().toLowerCase();
  if(!t) return [];
  const cap = t.charAt(0).toUpperCase()+t.slice(1);
  const adjItems = shuffleArr(CUSTOM_ADJECTIVES).slice(0,7).map(a=>`${a} ${t}`);
  const featItems = shuffleArr(CUSTOM_FEATURES).slice(0,7).map(f=>`${cap} ${f}`);
  const fillerItems = shuffleArr(CUSTOM_FILLER_FNS).slice(0,4).map(fn=>fn(t));
  return [...adjItems, ...featItems, ...fillerItems];
}

function generateCustomTheme(){
  const text = (state.customText||"").trim();
  if(!text) return;
  state.pool = generateCustomThemeLocal(text);
  state.theme = "__custom__";
  state.themeType = "open";
  render();
}

async function handleShareCard(){
  const target = document.getElementById('share-card');
  const btn = document.getElementById('share-btn');
  if(!target || typeof html2canvas === 'undefined') return;
  if(btn) btn.textContent = "Generating...";
  try{
    const canvas = await html2canvas(target, { backgroundColor: '#F5EFE3', scale: 2 });
    canvas.toBlob(async (blob)=>{
      const fileName = 'build-your-best.png';
      const file = new File([blob], fileName, { type: 'image/png' });
      if(navigator.share && navigator.canShare && navigator.canShare({ files:[file] })){
        try{
          await navigator.share({ files:[file], title:'Build Your Best', text:'Check out my build!' });
          if(btn) btn.textContent = "📸 Save as image";
          return;
        }catch(e){ /* cancelled or unsupported — fall back to download */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 3000);
      if(btn) btn.textContent = "📸 Save as image";
    }, 'image/png');
  }catch(e){
    if(btn) btn.textContent = "📸 Save as image";
  }
}

const JUDGE_OPENERS = [
  "The gavel comes down.", "Let's tally the damage.", "Auction's over — time to judge.", "Numbers don't lie, let's see them."
];
const JUDGE_STEAL_LINES = [
  (name,item,price)=>`${name} straight up stole ${item} for $${price}.`,
  (name,item,price)=>`Absolute bargain: ${name} walked off with ${item} for only $${price}.`,
  (name,item,price)=>`${name} got ${item} for pocket change — $${price}.`
];
const JUDGE_SPLURGE_LINES = [
  (name,item,price)=>`${name} went all in on ${item}, dropping $${price}.`,
  (name,item,price)=>`No restraint from ${name} — $${price} on ${item} alone.`,
  (name,item,price)=>`${name}'s big swing: ${item} for $${price}.`
];
const JUDGE_WIN_LINES = [
  (name)=>`${name} put more skin in the game and takes it.`,
  (name)=>`${name} committed harder to the bit — the win goes to ${name}.`,
  (name)=>`${name} simply wanted it more, dollar for dollar. ${name} takes it.`
];
const JUDGE_TIE_LINES = [
  "Dollar for dollar, it's a dead heat — call it a draw.",
  "Impossible to separate these two. Split the trophy.",
  "Too close to call — honestly, a tie."
];

function localJudge(){
  const g = state.game;
  const oppLabel = g.opponent ? g.opponent.name : "AI";
  const meSpent = 20 - g.me.budget;
  const oppSpent = 20 - g.opponent.budget;
  const meFreebies = g.me.items.filter(i=>i.freebie).length;
  const oppFreebies = g.opponent.items.filter(i=>i.freebie).length;
  const bought = (items)=> items.filter(i=>!i.freebie && i.p>0);
  const meTop = [...bought(g.me.items)].sort((a,b)=>b.p-a.p)[0];
  const oppTop = [...bought(g.opponent.items)].sort((a,b)=>b.p-a.p)[0];
  const meSteal = [...bought(g.me.items)].sort((a,b)=>a.p-b.p)[0];
  const oppSteal = [...bought(g.opponent.items)].sort((a,b)=>a.p-b.p)[0];

  const lines = [];
  lines.push(JUDGE_OPENERS[Math.floor(Math.random()*JUDGE_OPENERS.length)]);
  lines.push(`You put down $${meSpent} of your $20 across ${g.me.items.length} pick${g.me.items.length===1?'':'s'}${meFreebies?` (${meFreebies} freebie${meFreebies===1?'':'s'})`:''}.`);
  lines.push(`${oppLabel} spent $${oppSpent}, landing ${g.opponent.items.length} pick${g.opponent.items.length===1?'':'s'}${oppFreebies?` (${oppFreebies} freebie${oppFreebies===1?'':'s'})`:''}.`);

  if(meTop && meTop.p >= 5){
    const fn = JUDGE_SPLURGE_LINES[Math.floor(Math.random()*JUDGE_SPLURGE_LINES.length)];
    lines.push(fn("You", meTop.n, meTop.p));
  }
  if(oppTop && oppTop.p >= 5){
    const fn = JUDGE_SPLURGE_LINES[Math.floor(Math.random()*JUDGE_SPLURGE_LINES.length)];
    lines.push(fn(oppLabel, oppTop.n, oppTop.p));
  }
  if(meSteal && meSteal.p <= 2){
    const fn = JUDGE_STEAL_LINES[Math.floor(Math.random()*JUDGE_STEAL_LINES.length)];
    lines.push(fn("You", meSteal.n, meSteal.p));
  } else if(oppSteal && oppSteal.p <= 2){
    const fn = JUDGE_STEAL_LINES[Math.floor(Math.random()*JUDGE_STEAL_LINES.length)];
    lines.push(fn(oppLabel, oppSteal.n, oppSteal.p));
  }

  let winnerLabel = null;
  if(meSpent > oppSpent) winnerLabel = "You";
  else if(oppSpent > meSpent) winnerLabel = oppLabel;

  if(winnerLabel){
    const fn = JUDGE_WIN_LINES[Math.floor(Math.random()*JUDGE_WIN_LINES.length)];
    lines.push(fn(winnerLabel));
  } else {
    lines.push(JUDGE_TIE_LINES[Math.floor(Math.random()*JUDGE_TIE_LINES.length)]);
  }

  return { text: lines.join(" "), winner: winnerLabel };
}

function judgeBuilds(){
  const result = localJudge();
  state.winner = result.winner;
  state.verdict = result.text;
  render();
}

render();
